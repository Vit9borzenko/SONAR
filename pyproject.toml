[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "psiopyzer"
version = "0.1.0"
description = "PSIOP Analyzer — система анализа музыкальных предпочтений на предмет психологических индикаторов риска инсайдерских угроз"
authors = ["PSIOP Team"]
readme = "README.md"
license = "MIT"
packages = [{ include = "psiopyzer" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
pydantic-settings = "^2.0"
typer = "^0.12"
rich = "^13.0"
structlog = "^24.0"
plotly = "^5.18"
kaleido = "^0.2.1"
diskcache = "^5.6"
tenacity = "^8.2"
pyyaml = "^6.0"
joblib = "^1.3"
scikit-learn = "^1.4"
numpy = "^1.26"
pandas = "^2.1"
httpx = "^0.27"
yandex-music = "^2.2"
spotipy = "^2.23"
pylast = "^5.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
pytest-asyncio = "^0.23"
ruff = "^0.4"
black = "^24.0"
mypy = "^1.9"
pre-commit = "^3.6"

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*", "analyze_*"]
addopts = "-v --tb=short --cov=psiopyzer --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true